name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Node Dependencies
        run: npm install

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Standalone Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualKeyboard-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Rename APK for Release
        if: github.ref == 'refs/heads/main'
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk DBVKeyboard.apk
          cp android/app/build/outputs/apk/release/app-release.apk DigiVirtualKeyboard.apk
          cp android/app/build/outputs/apk/release/app-release.apk VirtualKeyboard.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: DBV Keyboard v1.1.0
          make_latest: true
          body: |
            ## 📱 DBV Keyboard v1.1.0 - Standalone Android Release by DigiBusTech

            ### Direct Mobile Downloads:
            - **[DBVKeyboard.apk](https://github.com/DigiBusTech/virtualkeyboard/releases/download/v1.1.0/DBVKeyboard.apk)**
            - **[DigiVirtualKeyboard.apk](https://github.com/DigiBusTech/virtualkeyboard/releases/download/v1.1.0/DigiVirtualKeyboard.apk)**
            - **[VirtualKeyboard.apk](https://github.com/DigiBusTech/virtualkeyboard/releases/download/v1.1.0/VirtualKeyboard.apk)**

            ### Features & Updates in v1.1.0:
            - **Native Consumer HID Media Controls**: Real working volume up/down, mute, screen brightness, keyboard backlight, mic mute, and media playback controls via USB HID Consumer Page 0x0C.
            - **Standard Function Keys (F1-F12)**: Pure hardware scan codes for BIOS, games, shortcuts, and IDE dev tools without OS interception.
            - **DBV Keyboard Rebranding**: Rebranded with official DigiBusTech `</>` code bracket branding, glowing animated splash screen, and vector launcher icons.
            - **Responsive Header Section**: Sleek tactile icon buttons for dark/light mode toggle and app info, eliminating edge clipping on all mobile screens.
            - **Full Screen Fitting**: Resolved landscape modal bottom collision with system navigation bar; responsive key heights and clear margins.
            - **Serverless Bluetooth HID**: Zero host software or companion drivers needed on PC, Mac, Linux, or smart TVs.
            - **60Hz Gesture Trackpad**: 1-finger left click, 2-finger right click, continuous drag scroll roller, and middle click.
            - **Auto-Registration**: Bluetooth HID profile auto-initializes on startup without manual setup.

            ### Installation:
            1. Download `DBVKeyboard.apk` directly on your Android phone.
            2. Tap the downloaded APK to install (allow "Install unknown apps" if prompted).
            3. Open the app, grant Bluetooth permissions, and pair with your PC/Mac!
          files: |
            DBVKeyboard.apk
            DigiVirtualKeyboard.apk
            VirtualKeyboard.apk



