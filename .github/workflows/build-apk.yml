name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Node Dependencies
        run: npm install

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Standalone Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualKeyboard-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Rename APK for Release
        if: github.ref == 'refs/heads/main'
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk VirtualKeyboard.apk
          cp android/app/build/outputs/apk/release/app-release.apk DigiVirtualKeyboard.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Digi VirtualKeyboard v1.0.0
          body: |
            ## 📱 Digi VirtualKeyboard v1.0.0 - Standalone Android Release by DigiBusTech

            ### Direct Mobile Downloads:
            - **[DigiVirtualKeyboard.apk](https://github.com/DigiBusTech/virtualkeyboard/releases/download/v1.0.0/DigiVirtualKeyboard.apk)**
            - **[VirtualKeyboard.apk](https://github.com/DigiBusTech/virtualkeyboard/releases/download/v1.0.0/VirtualKeyboard.apk)**

            ### Features:
            - **Soft Matte Tactile UI**: Modern squircle chiclet keys with spring animation physics and soft charcoal depth.
            - **Serverless Bluetooth HID**: Works as a native mouse & keyboard for any PC or Mac. Zero software needed on host!
            - **60Hz Gesture Trackpad**: 1-finger left click, 2-finger right click, 2-finger scroll.
            - **Macro Ribbon & Function Keys**: Slim scrollable touch bar for Copy, Paste, Undo, Desktop, and full F1-F12 + Media controls.
            - **Landscape & Responsive**: Seamless automatic layout adaptation when rotating phone horizontally.
            - **Auto-Registration**: Bluetooth HID profile auto-initializes on startup without manual setup.

            ### Installation:
            1. Download `DigiVirtualKeyboard.apk` directly on your Android device.
            2. Tap the downloaded file to install (allow "Install unknown apps" if prompted).
            3. Open the app, grant Bluetooth permissions, and pair with your PC/Mac!
          files: |
            VirtualKeyboard.apk
            DigiVirtualKeyboard.apk



